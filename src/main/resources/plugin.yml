name: UOP
version: '${version}'
main: com.ultraop.uop.UopPlugin
api-version: '1.21.11'
author: UltraOP
description: Upgraded UltraOP creator recording and server administration toolkit.
website: https://github.com/ultraop/uop
commands:
  uop:
    description: UOP recording toolkit command root
    usage: /uop help
    aliases: [ultraop]
permissions:
  uop.armor: { default: op }
  uop.checkpoint: { default: op }
  uop.damage: { default: op }
  uop.enchant: { default: op }
  uop.freeze: { default: op }
  uop.immortal: { default: op }
  uop.team: { default: op }
  uop.inv: { default: op }
  uop.name: { default: op }
  uop.protect: { default: op }
  uop.permission: { default: op }
  uop.admin: { default: op }
  uop.freeze.exempt: { default: false }
  uop.*:
    default: op
    children:
      uop.armor: true
      uop.checkpoint: true
      uop.damage: true
      uop.enchant: true
      uop.freeze: true
      uop.immortal: true
      uop.team: true
      uop.inv: true
      uop.name: true
      uop.protect: true
      uop.permission: true
      uop.admin: true
