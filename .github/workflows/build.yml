name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build
        run: gradle clean build --no-daemon --stacktrace
      - name: Validate plugin JAR
        shell: bash
        run: |
          set -euo pipefail
          jars=(build/libs/*.jar)
          test "${#jars[@]}" -eq 1
          jar="${jars[0]}"
          unzip -t "$jar"
          unzip -l "$jar" | grep -Fq 'plugin.yml'
          unzip -l "$jar" | grep -Fq 'com/ultraop/uop/UopPlugin.class'
          unzip -p "$jar" plugin.yml | grep -Fq "api-version: '1.21.11'"
          unzip -p "$jar" plugin.yml | grep -Fq 'main: com.ultraop.uop.UopPlugin'
          ! unzip -p "$jar" plugin.yml | grep -Fq '${version}'
      - name: Generate SHA-256 checksum
        shell: bash
        run: sha256sum build/libs/*.jar > build/libs/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: uop-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/libs/SHA256SUMS.txt
          if-no-files-found: error
